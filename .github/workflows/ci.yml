name: CI

# Lint, type-check, and test on every supported Python version.
# Runs on pull requests and pushes to main, and is called by
# publish.yml so a release tag goes through the exact same checks.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Type check
        run: uv run --python ${{ matrix.python-version }} mypy

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest
